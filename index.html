<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#17221d">
	<meta name="description" content="Fantasy football league dashboard and weekly stats.">
	<title>Jerry Stats</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #17221d;
			--paper: #f2f1e9;
			--panel: #fffefa;
			--muted: #69736b;
			--line: #d9ddd3;
			--lime: #d2f36b;
			--orange: #ef7653;
			--serif: Georgia, "Times New Roman", serif;
			--sans: "Trebuchet MS", "Segoe UI", sans-serif;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-width: 320px;
			min-height: 100vh;
			background-color: var(--paper);
			background-image: radial-gradient(#c7ccbf 0.7px, transparent 0.7px);
			background-size: 18px 18px;
			color: var(--ink);
			font-family: var(--sans);
		}

		button, input { font: inherit; }

		.masthead {
			min-height: 78px;
			padding: 0 clamp(20px, 5vw, 72px);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			color: #f5f4ec;
			background: var(--ink);
			border-bottom: 4px solid var(--lime);
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 12px;
			font-size: 13px;
			font-weight: 800;
			letter-spacing: 1.2px;
			text-transform: uppercase;
		}

		.brand-mark {
			width: 34px;
			height: 34px;
			display: grid;
			place-items: center;
			color: var(--ink);
			background: var(--lime);
			font-family: var(--serif);
			font-size: 19px;
			font-weight: 700;
			transform: rotate(-5deg);
		}

		.season-tag {
			display: inline-flex;
			align-items: center;
			gap: 9px;
			color: #d8ded6;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 1.1px;
			text-transform: uppercase;
		}

		.season-tag::before {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: var(--orange);
			content: "";
		}

		main {
			width: min(1320px, calc(100% - 40px));
			margin: 0 auto;
			padding: clamp(30px, 5vw, 58px) 0 54px;
		}

		.intro {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 24px;
			margin-bottom: 28px;
		}

		.eyebrow {
			margin: 0 0 9px;
			color: #617047;
			font-size: 11px;
			font-weight: 800;
			letter-spacing: 1.8px;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: var(--serif);
			font-size: clamp(38px, 6vw, 66px);
			font-weight: 500;
			line-height: 0.98;
		}

		.intro-note {
			max-width: 270px;
			margin: 0 0 3px;
			color: var(--muted);
			font-size: 14px;
			line-height: 1.5;
		}

		.dashboard-frame {
			overflow: hidden;
			border: 1px solid #cbd0c5;
			background: var(--panel);
			box-shadow: 7px 7px 0 #daddd2;
		}

		.frame-bar {
			min-height: 54px;
			padding: 10px 16px 10px 20px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			border-bottom: 1px solid var(--line);
		}

		.frame-title {
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 12px;
			font-weight: 800;
			letter-spacing: 0.7px;
			text-transform: uppercase;
		}

		.frame-title::before {
			width: 10px;
			height: 10px;
			background: var(--orange);
			content: "";
		}

		.frame-actions { display: flex; align-items: center; gap: 8px; }

		.icon-button, .text-button {
			min-height: 34px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
			border: 1px solid var(--line);
			color: var(--ink);
			background: transparent;
			cursor: pointer;
		}

		.icon-button { width: 36px; padding: 0; }
		.text-button { padding: 0 12px; font-size: 12px; font-weight: 700; }
		.icon-button:hover, .text-button:hover { background: #f1f4e9; }
		.icon-button svg { width: 16px; height: 16px; }

		.dashboard-area {
			min-height: 590px;
			position: relative;
			background: #fff;
		}

		iframe {
			width: 100%;
			height: min(78vh, 900px);
			min-height: 590px;
			display: block;
			border: 0;
			background: white;
		}

		.empty-state {
			min-height: 590px;
			padding: 40px 22px;
			display: grid;
			place-items: center;
			text-align: center;
			background: repeating-linear-gradient(135deg, #fffefa, #fffefa 15px, #f8f8f1 15px, #f8f8f1 30px);
		}

		.empty-content { width: min(100%, 510px); }

		.empty-number {
			margin-bottom: 10px;
			color: var(--orange);
			font-family: var(--serif);
			font-size: 44px;
			line-height: 1;
		}

		h2 {
			margin: 0 0 10px;
			font-family: var(--serif);
			font-size: 29px;
			font-weight: 500;
		}

		.empty-content p {
			margin: 0 auto 22px;
			color: var(--muted);
			font-size: 14px;
			line-height: 1.55;
		}

		.setup-form {
			display: flex;
			gap: 8px;
			text-align: left;
		}

		.setup-form input {
			min-width: 0;
			min-height: 44px;
			flex: 1;
			padding: 0 12px;
			border: 1px solid #cbd0c5;
			border-radius: 0;
			background: #fff;
		}

		.setup-form input:focus { outline: 2px solid #809b36; outline-offset: 1px; }

		.setup-form button {
			min-height: 44px;
			padding: 0 16px;
			border: 0;
			color: var(--ink);
			background: var(--lime);
			font-size: 12px;
			font-weight: 800;
			text-transform: uppercase;
			cursor: pointer;
		}

		.setup-form button:hover { background: #c4e552; }

		.status-message {
			min-height: 20px;
			margin-top: 9px !important;
			color: #9b3f2a !important;
			font-size: 12px !important;
		}

		.footer-line {
			margin-top: 24px;
			display: flex;
			justify-content: space-between;
			gap: 16px;
			color: #677168;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.8px;
			text-transform: uppercase;
		}

		[hidden] { display: none !important; }

		html, body, main, .dashboard-frame, .dashboard-area {
			width: 100%;
			min-width: 0;
			min-height: 100%;
			margin: 0;
			padding: 0;
			border: 0;
			background: #fff;
			box-shadow: none;
		}

		html, body { height: 100%; overflow: hidden; }
		iframe { width: 100%; height: 100vh; min-height: 100vh; }

		@media (max-width: 620px) {
			.masthead { min-height: 66px; padding: 0 18px; }
			.brand { font-size: 11px; letter-spacing: 0.8px; }
			.season-tag { font-size: 9px; letter-spacing: 0.6px; }
			main { width: 100%; padding: 0; }
			.intro { align-items: start; flex-direction: column; gap: 13px; margin-bottom: 20px; }
			.intro-note { max-width: 360px; }
			.frame-bar { padding: 9px 10px; }
			.frame-title { font-size: 10px; }
			.text-button { width: 36px; padding: 0; font-size: 0; }
			.text-button::before { font-size: 16px; content: "×"; }
			.dashboard-area, iframe, .empty-state { min-height: 68vh; }
			iframe { height: 100vh; min-height: 100vh; }
			.setup-form { flex-direction: column; }
			.setup-form button { width: 100%; }
			.footer-line { font-size: 9px; letter-spacing: 0.4px; }
		}
	</style>
</head>
<body>
	<main>
		<section class="dashboard-frame" aria-label="Fantasy football statistics dashboard">
			<div class="dashboard-area">
				<iframe title="Jerry Stats" src="https://datastudio.google.com/embed/reporting/d01041f4-12e0-4f56-b712-ae79806b28b4/page/1FBjB" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
			</div>
		</section>
	</main>
</body>
</html>
